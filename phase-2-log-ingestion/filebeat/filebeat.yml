# =============================================================================
# Filebeat — single Logstash output on port 5044
# The [log_type] field drives routing inside combined.conf
# =============================================================================

filebeat.inputs:

  # ---------------------------------------------------------------------------
  # Application JSON logs  ->  log_type: app_json
  # ---------------------------------------------------------------------------
  - type: log
    id: app-json-logs
    enabled: true
    paths:
      - /var/log/myapp/*.log
      - /var/log/myapp/**/*.log
    fields:
      log_type: "app_json"
    fields_under_root: true
    include_lines: ['^\{']

  # ---------------------------------------------------------------------------
  # Nginx access logs  ->  log_type: nginx_access
  # ---------------------------------------------------------------------------
  - type: log
    id: nginx-access-logs
    enabled: true
    paths:
      - /var/log/nginx/access.log
      - /var/log/nginx/access.log.*
    fields:
      log_type: "nginx_access"
    fields_under_root: true
    exclude_files: ['\.gz$']

  # ---------------------------------------------------------------------------
  # Syslog  ->  log_type: syslog
  # ---------------------------------------------------------------------------
  - type: log
    id: syslog-logs
    enabled: true
    paths:
      - /var/log/syslog
      - /var/log/syslog.*
      - /var/log/auth.log
      - /var/log/kern.log
    fields:
      log_type: "syslog"
    fields_under_root: true
    exclude_files: ['\.gz$']

# =============================================================================
# Processors
# =============================================================================
processors:
  - add_host_metadata:
      when.not.contains.tags: forwarded
  - add_docker_metadata: ~

# =============================================================================
# Output — everything goes to one port, combined.conf routes internally
# =============================================================================
output.logstash:
  hosts: ["logstash:5044"]

# =============================================================================
# Logging
# =============================================================================
logging.level: info

setup.kibana:
  host: "kibana:5601"

setup.template.enabled: false
setup.ilm.enabled: false